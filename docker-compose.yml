# Production-style deploy of the panel itself.
# The API drops to uid 65532 after preparing the data volume.
# Host mounts are read-only so the panel can report the machine it runs on.
# The Docker socket is not mounted. Compose inventory stays off until you opt in.

name: altas

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: altas-api:0.2.1
    restart: unless-stopped
    environment:
      ALTAS_ADDR: ":8080"
      ALTAS_DB: /data/altas.db
      ALTAS_ENV: production
      ALTAS_WEB_ORIGIN: http://127.0.0.1:8088
      ALTAS_HOST_PROC: /host/proc
      ALTAS_HOST_ROOT: /host/root
      ALTAS_PROJECTS_ROOT: /var/lib/altas/projects
      ALTAS_DOCKER_PROBE: "0"
      # Auto-update installs a host binary and restarts systemd. Leave it off here.
      # `docker compose restart api` restarts this image. It does not change it.
      ALTAS_METRICS_INTERVAL: 15s
      # GeoLite2-Country. The key comes from the environment or a .env file. Empty leaves the map empty.
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      ALTAS_GEOIP_DB: /data/GeoLite2-Country.mmdb
      # Optional Combined log tail. Off when unset. The path must be absolute and contain no "..".
      # ALTAS_ACCESS_LOG: /var/log/nginx/access.log
    volumes:
      - altas-data:/data
      - /proc:/host/proc:ro
      - /:/host/root:ro
      # Optional read-only inventory. Uncomment the socket and set ALTAS_DOCKER_PROBE=1.
      # Prefer a rootless socket or the docker group. Do not run the API as root.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: altas-web:0.2.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"

volumes:
  altas-data:
